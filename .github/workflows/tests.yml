name: PurePyCI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  lint_job:
    ##
    # Run quick linting and typing checks.
    # To disable all linting add "linter=false" to the xcookie config.
    # To disable type checks add "notypes" to the xcookie tags.
    ##
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - name: Set up Python 3.13 for linting
      uses: actions/setup-python@v5.6.0
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |-
        python -m pip install pip uv -U
        python -m uv pip install flake8
    - name: Lint with flake8
      run: |-
        # stop the build if there are Python syntax errors or undefined names
        flake8 ./ibeis --count --select=E9,F63,F7,F82 --show-source --statistics
  build_purepy_wheels:
    ##
    # Build the pure-python wheels independently on a per-platform basis.
    # These will be tested later in the test_purepy_wheels step.
    ##
    name: ${{ matrix.python-version }} on ${{ matrix.os }}, arch=${{ matrix.arch }} with ${{ matrix.install-extras }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        python-version:
        - '3.13'
        arch:
        - auto
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - name: Setup Python
      uses: actions/setup-python@v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build pure wheel
      shell: bash
      run: |-
        python -m pip install pip uv -U
        python -m uv pip install setuptools>=0.8 wheel build twine
        python -m build --wheel --outdir wheelhouse
        python -m twine check ./wheelhouse/ibeis*.whl
    - name: Show built files
      shell: bash
      run: ls -la wheelhouse
    - uses: actions/upload-artifact@v6.0.0
      name: Upload wheels artifact
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.arch }}
        path: ./wheelhouse/ibeis*.whl
  build_windows_installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
    # No submodules: CI builds against PyPI releases; tpl/ submodules are for
    # local development only.
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - name: Setup Python
      uses: actions/setup-python@v5.6.0
      with:
        python-version: '3.13'
    - name: Ensure uv bootstrap
      shell: pwsh
      run: |-
        python -m pip install -U pip
        python -m pip install -U uv
        python -m uv --version
    - name: Build installer
      shell: pwsh
      run: .\\dev\\_installers\\build_installer.ps1 -Clean -PyInstaller -Checks -SmokeTest -Inno
    - name: Show installer outputs
      shell: pwsh
      run: |-
        Get-ChildItem -Recurse dist | Format-Table FullName, Length, LastWriteTime
    - uses: actions/upload-artifact@v6.0.0
      name: Upload Windows installer artifact
      with:
        name: windows-installer-${{ github.run_id }}
        if-no-files-found: error
        path: |-
          dist\\installer\\*
          dist\\diagnostics\\*
  test_purepy_wheels:
    ##
    # Download and test the pure-python wheels that were built in the
    # build_purepy_wheels step in this independent environment.
    ##
    name: ${{ matrix.python-version }} on ${{ matrix.os }}, arch=${{ matrix.arch }} with ${{ matrix.install-extras }}
    if: "! startsWith(github.event.ref, 'refs/heads/release')"
    runs-on: ${{ matrix.os }}
    needs:
    - build_purepy_wheels
    strategy:
      fail-fast: false
      matrix:
        # Xcookie generates an explicit list of environments that will be used
        # for testing instead of using the more concise matrix notation.
        include:
        - python-version: '3.9'
          install-extras: tests-strict,runtime-strict,headless-strict
          os: ubuntu-latest
          arch: auto
        - python-version: '3.10'
          install-extras: tests-strict,runtime-strict,headless-strict
          os: ubuntu-latest
          arch: auto
        - python-version: '3.11'
          install-extras: tests-strict,runtime-strict,headless-strict
          os: ubuntu-latest
          arch: auto
        - python-version: '3.12'
          install-extras: tests-strict,runtime-strict,headless-strict
          os: ubuntu-latest
          arch: auto
        - python-version: '3.13'
          install-extras: tests-strict,runtime-strict,headless-strict
          os: ubuntu-latest
          arch: auto
        - python-version: '3.9'
          install-extras: tests-strict,runtime-strict,optional-strict,headless-strict
          os: ubuntu-latest
          arch: auto
        - python-version: '3.9'
          install-extras: tests,optional,headless
          os: ubuntu-latest
          arch: auto
        - python-version: '3.10'
          install-extras: tests,optional,headless
          os: ubuntu-latest
          arch: auto
        - python-version: '3.11'
          install-extras: tests,optional,headless
          os: ubuntu-latest
          arch: auto
        - python-version: '3.12'
          install-extras: tests,optional,headless
          os: ubuntu-latest
          arch: auto
        - python-version: '3.13'
          install-extras: tests,optional,headless
          os: ubuntu-latest
          arch: auto
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - name: Setup Python
      uses: actions/setup-python@v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - uses: actions/download-artifact@v4.1.8
      name: Download wheels
      with:
        pattern: wheels-*
        merge-multiple: true
        path: wheelhouse
    - name: Install wheel ${{ matrix.install-extras }}
      shell: bash
      env:
        INSTALL_EXTRAS: ${{ matrix.install-extras }}
      run: |-
        echo "Finding the path to the wheel"
        ls wheelhouse || echo "wheelhouse does not exist"
        echo "Installing helpers: update pip"
        python -m pip install pip uv -U
        echo "Installing helpers: setuptools"
        python -m uv pip install setuptools>=0.8 setuptools_scm wheel build -U
        echo "Installing helpers: tomli and pkginfo"
        python -m uv pip install tomli pkginfo packaging
        export WHEEL_FPATH=$(python -c "if 1:
            import pathlib
            from packaging import tags
            from packaging.utils import parse_wheel_filename
            dist_dpath = pathlib.Path('wheelhouse')
            wheels = sorted(dist_dpath.glob('ibeis*.whl'))
            if wheels:
                sys_tags = set(tags.sys_tags())
                matching = []
                for w in wheels:
                    try:
                        _, _, _, wheel_tags = parse_wheel_filename(w.name)
                    except Exception:
                        continue
                    if any(t in sys_tags for t in wheel_tags):
                        matching.append(w)
                fpath = sorted(matching or wheels)[-1]
            else:
                sdists = sorted(dist_dpath.glob('ibeis*.tar.gz'))
                if not sdists:
                    raise SystemExit('No wheel artifacts found in wheelhouse')
                fpath = sdists[-1]
            print(str(fpath).replace(chr(92), chr(47)))
        ")
        echo "WHEEL_FPATH=$WHEEL_FPATH"
        echo "INSTALL_EXTRAS=$INSTALL_EXTRAS"
        echo "UV_RESOLUTION=$UV_RESOLUTION"
        python -m pip install --prefer-binary "${WHEEL_FPATH}[${INSTALL_EXTRAS}]"
        echo "Install finished."
    - name: Test wheel ${{ matrix.install-extras }}
      shell: bash
      env:
        CI_PYTHON_VERSION: py${{ matrix.python-version }}
      run: |-
        echo "Creating test sandbox directory"
        export WORKSPACE_DNAME="testdir_${CI_PYTHON_VERSION}_${GITHUB_RUN_ID}_${RUNNER_OS}"
        echo "WORKSPACE_DNAME=$WORKSPACE_DNAME"
        mkdir -p $WORKSPACE_DNAME
        echo "cd-ing into the workspace"
        cd $WORKSPACE_DNAME
        pwd
        ls -altr
        # Get the path to the installed package and run the tests
        export MOD_DPATH=$(python -c "import ibeis, os; print(os.path.dirname(ibeis.__file__))")
        export MOD_NAME=ibeis
        echo "
        ---
        MOD_DPATH = $MOD_DPATH
        ---
        running the pytest command inside the workspace
        ---
        "
        mkdir -p "ci_ibeis_workdir"
        echo "About to reset workdirs"
        python -m ibeis --set-workdir="$(readlink -f ci_ibeis_workdir)" --nogui
        python -m ibeis --resetdbs
        python -m xdoctest $MOD_DPATH --style=google all
        echo "xdoctest command finished"
    - name: Run non-doctest pytest suites
      # These plain pytest modules are not covered by the xdoctest run and
      # previously never ran on CI (they rotted; see dev/code_smells.md 8.1).
      # Marked non-blocking until observed green across the matrix - promote
      # by removing continue-on-error.
      continue-on-error: true
      shell: bash
      run: |-
        python -m pytest -v tests ibeis/algo/graph/tests



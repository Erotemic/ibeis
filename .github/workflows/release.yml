name: PurePyRelease

on:
  push:
  workflow_dispatch:

jobs:
  build_purepy_wheels:
    ##
    # Build the pure-python wheels used by the release workflow.
    ##
    name: ${{ matrix.python-version }} on ${{ matrix.os }}, arch=${{ matrix.arch }} with ${{ matrix.install-extras }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        python-version:
        - '3.13'
        arch:
        - auto
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - name: Setup Python
      uses: actions/setup-python@v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build pure wheel
      shell: bash
      run: |-
        python -m pip install pip uv -U
        python -m uv pip install setuptools>=0.8 wheel build twine
        python -m build --wheel --outdir wheelhouse
        python -m twine check ./wheelhouse/ibeis*.whl
    - name: Show built files
      shell: bash
      run: ls -la wheelhouse
    - uses: actions/upload-artifact@v6.0.0
      name: Upload wheels artifact
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.arch }}
        path: ./wheelhouse/ibeis*.whl
  build_windows_installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
      with:
        submodules: recursive
    - name: Setup Python
      uses: actions/setup-python@v5.6.0
      with:
        python-version: '3.13'
    - name: Ensure uv bootstrap
      shell: pwsh
      run: |-
        python -m pip install -U pip
        python -m pip install -U uv
        python -m uv --version
    - name: Build installer
      shell: pwsh
      run: .\\dev\\_installers\\build_installer.ps1 -Clean -PyInstaller -Checks -SmokeTest -Inno
    - name: Show installer outputs
      shell: pwsh
      run: |-
        Get-ChildItem -Recurse dist | Format-Table FullName, Length, LastWriteTime
    - uses: actions/upload-artifact@v6.0.0
      name: Upload Windows installer release artifact
      with:
        name: windows-installer-release-artifacts
        if-no-files-found: error
        path: dist\\installer\\*.exe
  test_deploy:
    name: Deploy Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.event.ref == 'refs/heads/main'
    needs:
    - build_purepy_wheels
    - build_windows_installer
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - uses: actions/download-artifact@v4.1.8
      name: Download wheels
      with:
        pattern: wheels-*
        merge-multiple: true
        path: wheelhouse
    - uses: actions/download-artifact@v4.1.8
      name: Download Windows installer
      with:
        name: windows-installer-release-artifacts
        path: installer
    - name: Show files to upload
      shell: bash
      run: |-
        ls -la wheelhouse
        ls -la installer
    - name: Sign distributions
      env:
        GPG_SECRET_SIGNING_SUBKEY_B64: ${{ secrets.GPG_SECRET_SIGNING_SUBKEY_B64 }}
        GPG_PUBLIC_KEY_B64: ${{ secrets.GPG_PUBLIC_KEY_B64 }}
        GPG_OWNER_TRUST_B64: ${{ secrets.GPG_OWNER_TRUST_B64 }}
      run: |-
        GPG_EXECUTABLE=gpg
        $GPG_EXECUTABLE --version
        openssl version
        $GPG_EXECUTABLE --list-keys
        echo "Importing GPG keys from CI secrets"
        printf '%s' "$GPG_PUBLIC_KEY_B64" | base64 -d | $GPG_EXECUTABLE --import
        printf '%s' "$GPG_OWNER_TRUST_B64" | base64 -d | $GPG_EXECUTABLE --import-ownertrust
        printf '%s' "$GPG_SECRET_SIGNING_SUBKEY_B64" | base64 -d | $GPG_EXECUTABLE --import
        echo "Finish importing GPG keys"
        $GPG_EXECUTABLE --list-keys || true
        $GPG_EXECUTABLE --list-keys
        GPG_KEYID=$(cat dev/public_gpg_key)
        echo "GPG_KEYID = '$GPG_KEYID'"
        IMPORTED_FPR=$($GPG_EXECUTABLE --list-keys --with-colons "$GPG_KEYID" | awk -F: '/^fpr/ { print $10; exit }')
        if [[ "$IMPORTED_FPR" != "$GPG_KEYID" ]]; then echo "ERROR: imported GPG fingerprint $IMPORTED_FPR does not match pinned $GPG_KEYID"; exit 1; fi
        echo "GPG fingerprint verified: $IMPORTED_FPR"
        VERSION=$(python -c "import setup; print(setup.VERSION)")
        python -m pip install pip uv -U
        python -m pip install packaging twine -U
        python -m pip install urllib3 requests[security]
        GPG_SIGN_CMD="$GPG_EXECUTABLE --batch --yes --detach-sign --armor --local-user $GPG_KEYID"
        DIST_PATHS=(wheelhouse/*.whl installer/*.exe)
        DIST_PATHS_STR=$(printf '"%s" ' "${DIST_PATHS[@]}")
        echo "$DIST_PATHS_STR"
        for DIST_PATH in "${DIST_PATHS[@]}"
        do
            echo "------"
            echo "DIST_PATH = $DIST_PATH"
            $GPG_SIGN_CMD --output $DIST_PATH.asc $DIST_PATH
            $GPG_EXECUTABLE --verify $DIST_PATH.asc $DIST_PATH  || echo "hack, the first run of gpg very fails"
            $GPG_EXECUTABLE --verify $DIST_PATH.asc $DIST_PATH
        done
        ls -la wheelhouse
        ls -la installer
        python -m pip install opentimestamps-client
        ots stamp wheelhouse/*.whl installer/*.exe wheelhouse/*.asc installer/*.asc
        ls -la wheelhouse
        ls -la installer
    - name: Prepare publish directory
      shell: bash
      run: |-
        mkdir -p publish_wheelhouse
        shopt -s nullglob
        for FPATH in wheelhouse/*.whl wheelhouse/*.tar.gz wheelhouse/*.zip
        do
            cp "$FPATH" publish_wheelhouse/
        done
        ls -la publish_wheelhouse
    - name: Publish test artifacts to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: publish_wheelhouse
        skip-existing: true
        repository-url: https://test.pypi.org/legacy/
    - uses: actions/upload-artifact@v6.0.0
      name: Upload deploy artifacts
      with:
        name: deploy_artifacts
        path: |-
          wheelhouse/*.whl
          wheelhouse/*.asc
          wheelhouse/*.ots
          installer/*.exe
          installer/*.asc
          installer/*.ots
    permissions:
      contents: read
      id-token: write
    environment: testpypi
  live_deploy:
    name: Deploy Live
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (startsWith(github.event.ref, 'refs/tags') || startsWith(github.event.ref, 'refs/heads/release'))
    needs:
    - build_purepy_wheels
    - build_windows_installer
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - uses: actions/download-artifact@v4.1.8
